name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Strict TypeScript sanity check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters --noImplicitReturns

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Integration smoke test
        run: xvfb-run -a npm run test:integration

      - name: Minimum supported VS Code smoke test
        env:
          VSCODE_TEST_VERSION: '1.101.0'
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npm run package

      - name: Smoke test the packaged extension outside the source tree
        env:
          HBS_MASTER_EXTENSION_PATH: ${{ runner.temp }}/hbs-master-vsix/extension
        run: |
          VSIX_NAME="$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.vsix'")"
          python3 -m zipfile -e "$VSIX_NAME" "$RUNNER_TEMP/hbs-master-vsix"
          xvfb-run -a npm run test:integration

  cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Strict TypeScript sanity check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters --noImplicitReturns
